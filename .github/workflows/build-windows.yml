name: Build PyForge for Windows

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Package PyForge
        shell: pwsh
        run: |
          $pyinstallerArgs = @(
            "--noconfirm",
            "--clean",
            "--windowed",
            "--name", "PyForge",
            "--onedir",
            "--collect-all", "PySide6",
            "--collect-all", "shiboken6",
            "--add-data", "dark.qss;.",
            "--add-data", "Assets;Assets"
          )

          Get-ChildItem -Path . -Filter "*.ui" -File | ForEach-Object {
            $pyinstallerArgs += @("--add-data", "$($_.FullName);.")
          }

          $pyinstallerArgs += "PyForge.py"
          python -m PyInstaller @pyinstallerArgs

      - name: Create ZIP bundle
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/PyForge" -DestinationPath "dist/PyForge-Windows-x64.zip"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: PyForge-Windows-x64
          path: dist/PyForge-Windows-x64.zip
          if-no-files-found: error
